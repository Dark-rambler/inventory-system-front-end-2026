<div
  class="flex flex-col sm:flex-row items-center justify-between gap-3 px-4 py-3 bg-white border-t border-gray-100 rounded-b-xl select-none"
>
  <!-- Left: info + page size selector -->
  <div class="flex items-center gap-3 order-2 sm:order-1">
    <p class="text-sm text-gray-400">
      Mostrando
      <span class="font-semibold text-gray-600">{{ startItem() }}–{{ endItem() }}</span>
      de
      <span class="font-semibold text-gray-600">{{ paginator().totalCount }}</span>
      resultados
    </p>

    <div class="flex items-center gap-1.5">
      <label class="text-xs text-gray-400 whitespace-nowrap" for="pageSizeSelect">Filas</label>
      <select
        id="pageSizeSelect"
        class="h-7 rounded-lg border border-gray-200 bg-white px-2 text-xs text-gray-600 font-medium cursor-pointer transition-colors hover:border-primary/40 hover:text-primary focus:outline-none focus:ring-2 focus:ring-primary/30"
        [value]="currentPageSize()"
        (change)="onPageSizeChange($event)"
      >
        @for (size of pageSizeOptions; track size) {
          <option [value]="size">{{ size }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="flex items-center gap-1 order-1 sm:order-2" aria-label="Paginación">
    <!-- Prev -->
    <button
      class="inline-flex items-center justify-center h-8 w-8 rounded-lg border text-sm font-medium transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
      [ngClass]="
        isPrevDisabled()
          ? 'border-gray-100 text-gray-300 cursor-not-allowed bg-gray-50'
          : 'border-gray-200 text-gray-500 bg-white hover:border-primary/40 hover:text-primary hover:bg-primary/5'
      "
      [disabled]="isPrevDisabled()"
      (click)="goToPage(currentPage() - 1)"
      aria-label="Página anterior"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <!-- First page -->
    @if (showFirst()) {
      <button
        class="inline-flex items-center justify-center h-8 min-w-8 px-2 rounded-lg border border-gray-200 text-sm font-medium text-gray-600 bg-white transition-all duration-150 hover:border-primary/40 hover:text-primary hover:bg-primary/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
        (click)="goToPage(1)"
      >
        1
      </button>
    }

    @if (showFirstEllipsis()) {
      <span class="inline-flex items-end justify-center h-8 w-6 text-gray-400 text-sm pb-0.5"
        >…</span
      >
    }

    <!-- Window pages -->
    @for (page of pages(); track page) {
      <button
        class="inline-flex items-center justify-center h-8 min-w-8 px-2 rounded-lg border text-sm font-medium transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
        [ngClass]="
          page === currentPage()
            ? 'border-primary bg-primary text-white shadow-sm shadow-primary/20 pointer-events-none'
            : 'border-gray-200 text-gray-600 bg-white hover:border-primary/40 hover:text-primary hover:bg-primary/5'
        "
        [attr.aria-current]="page === currentPage() ? 'page' : null"
        (click)="goToPage(page)"
      >
        {{ page }}
      </button>
    }

    @if (showLastEllipsis()) {
      <span class="inline-flex items-end justify-center h-8 w-6 text-gray-400 text-sm pb-0.5"
        >…</span
      >
    }

    <!-- Last page -->
    @if (showLast()) {
      <button
        class="inline-flex items-center justify-center h-8 min-w-8 px-2 rounded-lg border border-gray-200 text-sm font-medium text-gray-600 bg-white transition-all duration-150 hover:border-primary/40 hover:text-primary hover:bg-primary/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
        (click)="goToPage(paginator().totalPages)"
      >
        {{ paginator().totalPages }}
      </button>
    }

    <!-- Next -->
    <button
      class="inline-flex items-center justify-center h-8 w-8 rounded-lg border text-sm font-medium transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
      [ngClass]="
        isNextDisabled()
          ? 'border-gray-100 text-gray-300 cursor-not-allowed bg-gray-50'
          : 'border-gray-200 text-gray-500 bg-white hover:border-primary/40 hover:text-primary hover:bg-primary/5'
      "
      [disabled]="isNextDisabled()"
      (click)="goToPage(currentPage() + 1)"
      aria-label="Página siguiente"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </nav>
</div>
