<div
  class="flex select-none flex-col items-center justify-between gap-2 rounded-b-xl border-t border-slate-200 bg-slate-50/70 px-3 py-2.5 dark:border-slate-700 dark:bg-slate-800/70 sm:flex-row"
>
  <!-- Left: info + page size selector -->
  <div class="order-2 flex items-center gap-2.5 sm:order-1">
    <p class="text-xs text-slate-500 dark:text-slate-400">
      Mostrando
      <span class="font-semibold text-slate-700 dark:text-slate-200"
        >{{ startItem() }}–{{ endItem() }}</span
      >
      de
      <span class="font-semibold text-slate-700 dark:text-slate-200">{{
        paginator().totalCount
      }}</span>
      resultados
    </p>

    <div class="flex items-center gap-1">
      <label
        class="whitespace-nowrap text-xs text-slate-500 dark:text-slate-400"
        for="pageSizeSelect"
        >Filas</label
      >
      <select
        id="pageSizeSelect"
        class="h-6 cursor-pointer rounded-md border border-slate-200 bg-white px-1.5 text-xs font-medium text-slate-700 transition-colors hover:border-primary/40 hover:text-primary focus:outline-none focus:ring-2 focus:ring-primary/30 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:border-primary-400/50 dark:hover:text-primary-300"
        [value]="currentPageSize()"
        (change)="onPageSizeChange($event)"
      >
        @for (size of pageSizeOptions; track size) {
          <option [value]="size">{{ size }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="order-1 flex items-center gap-1 sm:order-2" aria-label="Paginación">
    <!-- Prev -->
    <button
      class="inline-flex h-7 w-7 items-center justify-center rounded-md border text-xs font-medium transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
      [ngClass]="
        isPrevDisabled()
          ? 'cursor-not-allowed border-slate-200 bg-slate-100 text-slate-300 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-500'
          : 'border-slate-200 bg-white text-slate-500 hover:border-primary/40 hover:bg-primary/5 hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-primary-400/40 dark:hover:bg-slate-800 dark:hover:text-primary-300'
      "
      [disabled]="isPrevDisabled()"
      (click)="goToPage(currentPage() - 1)"
      aria-label="Página anterior"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    <!-- First page -->
    @if (showFirst()) {
      <button
        class="inline-flex h-7 min-w-7 items-center justify-center rounded-md border border-slate-200 bg-white px-1.5 text-xs font-medium text-slate-600 transition-all duration-150 hover:border-primary/40 hover:bg-primary/5 hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-primary-400/40 dark:hover:bg-slate-800 dark:hover:text-primary-300"
        (click)="goToPage(1)"
      >
        1
      </button>
    }

    @if (showFirstEllipsis()) {
      <span
        class="inline-flex h-7 w-5 items-end justify-center pb-0.5 text-xs text-slate-400 dark:text-slate-500"
        >…</span
      >
    }

    <!-- Window pages -->
    @for (page of pages(); track page) {
      <button
        class="inline-flex h-7 min-w-7 items-center justify-center rounded-md border px-1.5 text-xs font-medium transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
        [ngClass]="
          page === currentPage()
            ? 'pointer-events-none border-primary bg-primary text-white shadow-sm shadow-primary/20'
            : 'border-slate-200 bg-white text-slate-600 hover:border-primary/40 hover:bg-primary/5 hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-primary-400/40 dark:hover:bg-slate-800 dark:hover:text-primary-300'
        "
        [attr.aria-current]="page === currentPage() ? 'page' : null"
        (click)="goToPage(page)"
      >
        {{ page }}
      </button>
    }

    @if (showLastEllipsis()) {
      <span
        class="inline-flex h-7 w-5 items-end justify-center pb-0.5 text-xs text-slate-400 dark:text-slate-500"
        >…</span
      >
    }

    <!-- Last page -->
    @if (showLast()) {
      <button
        class="inline-flex h-7 min-w-7 items-center justify-center rounded-md border border-slate-200 bg-white px-1.5 text-xs font-medium text-slate-600 transition-all duration-150 hover:border-primary/40 hover:bg-primary/5 hover:text-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-primary-400/40 dark:hover:bg-slate-800 dark:hover:text-primary-300"
        (click)="goToPage(paginator().totalPages)"
      >
        {{ paginator().totalPages }}
      </button>
    }

    <!-- Next -->
    <button
      class="inline-flex h-7 w-7 items-center justify-center rounded-md border text-xs font-medium transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary/50"
      [ngClass]="
        isNextDisabled()
          ? 'cursor-not-allowed border-slate-200 bg-slate-100 text-slate-300 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-500'
          : 'border-slate-200 bg-white text-slate-500 hover:border-primary/40 hover:bg-primary/5 hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-primary-400/40 dark:hover:bg-slate-800 dark:hover:text-primary-300'
      "
      [disabled]="isNextDisabled()"
      (click)="goToPage(currentPage() + 1)"
      aria-label="Página siguiente"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </nav>
</div>
