<div class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50">
  <div
    [class]="
      'relative rounded-lg bg-white p-8 shadow-2xl dark:bg-slate-900 dark:ring-1 dark:ring-slate-700 ' +
      width()
    "
  >
    <div
      class="mb-6 flex items-center justify-between border-b border-primary pb-4 dark:border-slate-700"
    >
      <h2 class="text-xl font-semibold text-gray-700 dark:text-slate-100">{{ title() }}</h2>

      @if (showCloseButton()) {
        <button
          type="button"
          (click)="onClose()"
          class="text-gray-400 transition-colors duration-200 hover:text-gray-600 dark:text-slate-400 dark:hover:text-slate-200"
          aria-label="Cerrar modal"
        >
          <svg appCloseModal class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12"
            />
          </svg>
        </button>
      }
    </div>

    <div class="modal-body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
