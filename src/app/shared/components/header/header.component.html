<header
  class="fixed top-0 left-0 right-0 z-50 h-16 border-b border-slate-200/80 bg-white/90 shadow-sm backdrop-blur-md dark:border-slate-700/80 dark:bg-slate-900/90"
>
  <div class="flex h-full items-center justify-between px-4 sm:px-6">
    <div class="flex items-center gap-3 sm:gap-4">
      <button
        (click)="toggleSidebar()"
        class="-ml-1 rounded-lg p-2 text-slate-500 transition-all hover:bg-primary/10 hover:text-primary dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-primary-300 lg:hidden"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>

      <div class="flex items-center gap-3">
        <div
          class="flex h-9 w-9 items-center justify-center rounded-lg bg-gradient-to-br from-primary-700 to-secondary-600 text-white shadow-sm"
        >
          <svg class="h-5 w-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
          </svg>
        </div>

        <div>
          <p class="text-[11px] uppercase tracking-[0.16em] text-slate-400 dark:text-slate-500">
            Sistema
          </p>
          <h1
            class="text-base font-semibold leading-tight text-slate-800 dark:text-slate-100 sm:text-lg"
          >
            Inventario central
          </h1>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        (click)="toggleTheme()"
        class="group relative rounded-lg border border-slate-200/80 bg-white p-2.5 text-slate-500 transition-all hover:border-primary/30 hover:bg-primary/5 hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-primary-400/40 dark:hover:bg-slate-800 dark:hover:text-primary-300"
        [attr.aria-label]="isDarkMode() ? 'Activar modo claro' : 'Activar modo oscuro'"
      >
        @if (isDarkMode()) {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M12 3v2m0 14v2m7-9h2M3 12H1m15.364 6.364l1.414 1.414M6.222 6.222L4.808 4.808m12.728 0l-1.414 1.414M6.222 17.778l-1.414 1.414M12 8a4 4 0 100 8 4 4 0 000-8z"
            />
          </svg>
        } @else {
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M20.354 15.354A9 9 0 118.646 3.646a7 7 0 1011.708 11.708z"
            />
          </svg>
        }
      </button>

      <button
        class="group relative rounded-lg border border-slate-200/80 bg-white p-2.5 text-slate-500 transition-all hover:border-primary/30 hover:bg-primary/5 hover:text-primary dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:border-primary-400/40 dark:hover:bg-slate-800 dark:hover:text-primary-300"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="1.5"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
          />
        </svg>
        <span
          class="absolute top-1.5 right-1.5 flex h-4 w-4 items-center justify-center rounded-full bg-danger text-[10px] font-bold text-white"
          >3</span
        >
      </button>

      <div class="mx-1 hidden h-8 w-px bg-slate-200 dark:bg-slate-700 sm:block"></div>

      <div
        class="-mr-1.5 flex cursor-pointer items-center gap-3 rounded-lg p-1.5 transition-colors hover:bg-slate-100/80 dark:hover:bg-slate-800/80"
      >
        <div class="text-right hidden sm:block">
          <p class="text-sm font-semibold text-slate-800 dark:text-slate-100">{{ userName() }}</p>
          <p class="text-xs text-slate-500 dark:text-slate-400">{{ currentRole() | role }}</p>
        </div>
        <div
          class="flex h-9 w-9 items-center justify-center rounded-full bg-gradient-to-br from-primary-700 to-secondary-600 text-white shadow-sm"
        >
          <span class="text-sm font-bold">A</span>
        </div>
      </div>
    </div>
  </div>
</header>
