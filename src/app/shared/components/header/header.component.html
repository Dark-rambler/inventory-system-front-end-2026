<header class="bg-white border-b border-gray-3 h-16 fixed top-0 left-0 right-0 z-50">
  <div class="flex items-center justify-between h-full px-6">
    <div class="flex items-center gap-4">
      <button
        (click)="toggleSidebar()"
        class="lg:hidden text-gray-1 hover:text-primary transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
      <h1 class="text-h4 text-black">Inventory System</h1>
    </div>

    <div class="flex items-center gap-4">
      <button class="text-gray-1 hover:text-primary transition-colors relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
          />
        </svg>
        <span
          class="absolute -top-1 -right-1 bg-danger text-white text-caption rounded-full w-4 h-4 flex items-center justify-center"
          >3</span
        >
      </button>

      <div class="flex items-center gap-3">
        <div class="text-right hidden md:block">
          <p class="text-small text-black font-medium">Usuario Admin</p>
          <p class="text-caption text-gray-2">Administrador</p>
        </div>
        <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center text-white">
          <span class="text-small font-medium">UA</span>
        </div>
      </div>
    </div>
  </div>
</header>
