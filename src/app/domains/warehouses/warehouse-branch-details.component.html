<section class="space-y-3">
  <div
    class="flex flex-col gap-3 rounded-xl border border-slate-200 bg-white px-4 py-3 shadow-sm sm:flex-row sm:items-center sm:justify-between sm:px-5"
  >
    <div>
      <h1 class="text-xl font-semibold text-slate-800 sm:text-2xl">
        Detalle del Almacén {{ branchName() ?? '' }}
      </h1>
      <p class="text-sm text-slate-500">Revisa productos y movimientos asociados al almacén.</p>
    </div>
  </div>

  <app-tabs ariaLabel="Detalle de sucursal" defaultTabId="warehouse-products">
    <ng-template
      appTabPanel="warehouse-products"
      tabLabel="Productos"
      [tabBadge]="tabCounts().products"
    >
      <app-warehouse-branch-products-table></app-warehouse-branch-products-table>
    </ng-template>

    <ng-template
      appTabPanel="warehouse-movements"
      tabLabel="Movimientos"
      [tabBadge]="tabCounts().movements"
    >
      <app-warehouse-branch-movements-table></app-warehouse-branch-movements-table>
    </ng-template>
  </app-tabs>
</section>
