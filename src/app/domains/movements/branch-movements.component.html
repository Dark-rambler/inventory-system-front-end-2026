<section class="space-y-3">
  <app-movements-header
    [title]="'Sucursal ' + (branchName() ?? branchId() ?? '')"
    [showCreateButton]="false"
    [branchId]="branchId()"
  />

  <app-tabs ariaLabel="Tablas de sucursal" defaultTabId="branch-sales">
    <ng-template appTabPanel="branch-sales" tabLabel="Ventas">
      <div class="space-y-3">
        <app-sales-filters></app-sales-filters>
        <app-sales-table></app-sales-table>
      </div>
    </ng-template>

    <ng-template appTabPanel="branch-movements" tabLabel="Movimientos">
      <div class="space-y-3">
        <app-movements-filters [hideBranchFilter]="true"></app-movements-filters>
        <app-create-branch-movement />
      </div>
    </ng-template>

    <ng-template appTabPanel="branch-products" tabLabel="Productos">
      <div class="space-y-3">
        <app-inventory-filters></app-inventory-filters>
        <p class="text-sm font-medium text-slate-700 dark:text-slate-200">tabla2</p>
        <app-inventory-table></app-inventory-table>
        <section
          class="rounded-xl border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900"
        >
          <div
            class="flex flex-col gap-3 border-b border-slate-200 bg-gradient-to-r from-slate-50 via-white to-slate-50 px-4 py-3 dark:border-slate-700 dark:from-slate-900 dark:via-slate-900 dark:to-slate-800/70 sm:flex-row sm:items-center sm:justify-between"
          >
            <div>
              <p
                class="text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-500 dark:text-slate-400"
              >
                Gestión de catálogo
              </p>
              <h3 class="text-sm font-semibold text-slate-800 dark:text-slate-100 sm:text-base">
                Productos no agregados a la sucursal
              </h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 sm:text-sm">
                Selecciona uno o varios productos y agrégalos a esta sucursal.
              </p>
            </div>

            <div class="flex items-center gap-3">
              <span
                class="rounded-full border border-primary/20 bg-primary/10 px-2.5 py-1 text-xs font-semibold text-primary-700 dark:border-primary-400/30 dark:bg-primary-400/15 dark:text-primary-300"
              >
                {{ selectedMissingProductIds().length }} seleccionados
              </span>

              <app-button
                label="Agregar productos"
                variant="primary"
                [loading]="isAddingProducts()"
                [disabled]="
                  selectedMissingProductIds().length === 0 ||
                  selectedMissingProductsPayload().length !== selectedMissingProductIds().length
                "
                (buttonClick)="addSelectedProductsToBranch()"
              >
                <svg
                  slot="icon"
                  class="h-4 w-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4v16m8-8H4"
                  />
                </svg>
              </app-button>
            </div>
          </div>

          <div class="p-3 dark:bg-slate-900">
            <app-branch-missing-products-table
              [branchId]="branchId()"
              [resetKey]="missingProductsResetKey()"
              (selectedProductIdsChange)="onMissingProductsSelectionChange($event)"
              (selectedProductsPayloadChange)="onMissingProductsPayloadChange($event)"
            ></app-branch-missing-products-table>
          </div>
        </section>
      </div>
    </ng-template>
  </app-tabs>
</section>
