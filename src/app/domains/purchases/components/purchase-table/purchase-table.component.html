<section
  class="overflow-hidden rounded-b-xl rounded-t-none border border-slate-200 bg-white shadow-sm dark:border-slate-700 dark:bg-slate-900 [&_.app-table-container]:rounded-none [&_.app-table-container]:border-0 [&_.app-table-container]:shadow-none"
>
  <app-table
    [data]="purchaseData()?.items ?? []"
    [columns]="purchaseColumns"
    [config]="tableConfig()"
  >
    <ng-template appTableColumn="items" let-purchase>
      <span class="font-medium text-slate-800 dark:text-slate-100">
        {{ purchase.purchaseDetails?.length ?? purchase.items ?? 0 }}
      </span>
    </ng-template>

    <ng-template appTableColumn="total" let-purchase>
      <span class="font-medium text-slate-800 dark:text-slate-100">
        {{ purchase.total | currency: 'BOB' : 'symbol' : '1.2-2' }}
      </span>
    </ng-template>

    <ng-template appTableColumn="date" let-purchase>
      <span class="text-slate-700 dark:text-slate-300">
        {{ purchase.date | date: 'dd/MM/yyyy' }}
      </span>
    </ng-template>

    <ng-template appTableColumn="actions" let-purchase>
      <app-action-buttons>
        <div appEditItem>
          <app-icon-button (buttonClick)="editPurchase(purchase)" action="edit" />
        </div>

        <div>
          <app-icon-button
            (buttonClick)="deletePurchase(purchase)"
            action="delete"
            tooltip="Eliminar"
          />
        </div>
      </app-action-buttons>
    </ng-template>
  </app-table>

  @if (purchaseData(); as data) {
    <app-paginator
      [paginator]="data"
      [currentPage]="currentPage().page ?? 1"
      [currentPageSize]="currentPage().pageSize ?? 10"
      (pageChange)="changePage($event)"
      (pageSizeChange)="changePageSize($event)"
    />
  }
</section>
