<app-accordion title="Filtros de usuarios">
  <form [formGroup]="filtersForm" class="grid grid-cols-1 gap-4 p-5 sm:grid-cols-2 xl:grid-cols-4">
    <app-form-input
      [parentForm]="filtersForm"
      controlName="name"
      label="Nombre"
      name="name"
      placeholder="Buscar por nombre"
    ></app-form-input>

    <app-form-input
      [parentForm]="filtersForm"
      controlName="userName"
      label="Usuario"
      name="userName"
      placeholder="Buscar por usuario"
    ></app-form-input>

    <app-form-input
      [parentForm]="filtersForm"
      controlName="email"
      label="Correo"
      name="email"
      placeholder="Buscar por correo"
      type="email"
    ></app-form-input>

    <app-form-input
      [parentForm]="filtersForm"
      controlName="role"
      label="Rol"
      name="role"
      placeholder="Buscar por rol"
    ></app-form-input>
  </form>
</app-accordion>
