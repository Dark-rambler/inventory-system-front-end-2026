<article
  class="flex min-h-0 flex-col overflow-hidden rounded-xl border border-gray-200 bg-white p-4 shadow-sm xl:h-full"
>
  <header class="mb-2.5">
    <p class="text-xs sm:text-sm text-gray-500">{{ chart().description }}</p>
    <h3 class="text-base sm:text-lg font-semibold text-secondary leading-tight">
      {{ chart().title }}
    </h3>
  </header>

  <section
    class="mb-3 flex items-end justify-between gap-3 rounded-lg border border-gray-100 bg-gray-50/70 px-3 py-2"
  >
    <div>
      <p class="text-xs text-gray-500 uppercase tracking-wide">{{ chart().metricLabel }}</p>
      <p class="text-xl sm:text-2xl font-semibold text-secondary">{{ chart().metricValue }}</p>
    </div>
    <p class="rounded-full px-2 py-0.5 text-xs sm:text-sm font-medium" [ngClass]="trendClass">
      {{ chart().trend }}
    </p>
  </section>

  <div
    class="grid flex-1 min-h-0 grid-cols-1 items-center gap-3 lg:grid-cols-[minmax(0,160px)_minmax(0,1fr)]"
  >
    <div class="relative h-[140px] sm:h-[150px] lg:h-[160px]">
      <canvas #chartCanvas></canvas>
    </div>

    @if (chart().type === 'doughnut') {
      <div class="space-y-1.5">
        @for (item of summaryItems; track item.label) {
          <div
            class="flex items-center justify-between gap-3 rounded-lg border border-gray-100 px-2.5 py-1.5"
          >
            <div class="flex items-center gap-3 min-w-0">
              <span class="h-3 w-3 rounded-full" [style.background-color]="item.color"></span>
              <div class="min-w-0">
                <p class="text-xs sm:text-sm font-medium text-secondary truncate">
                  {{ item.label }}
                </p>
                <p class="text-[11px] sm:text-xs text-gray-500">{{ item.percentage }}% del total</p>
              </div>
            </div>
            <p class="text-xs sm:text-sm font-semibold text-secondary whitespace-nowrap">
              {{ item.value | number }}
            </p>
          </div>
        }
      </div>
    }
  </div>
</article>
