<div class="grid min-h-0 h-full grid-cols-1 gap-3 lg:grid-cols-2 xl:grid-cols-1 xl:pl-1">
  @if (areChartsLoading()) {
    @for (index of [1]; track index) {
      <article
        class="h-full overflow-hidden rounded-xl border border-gray-200 bg-white p-4 shadow-sm animate-pulse"
      >
        <div class="h-3 w-36 rounded bg-gray-200 mb-2"></div>
        <div class="h-4 w-40 rounded bg-gray-200 mb-3"></div>
        <div class="h-7 w-24 rounded bg-gray-100 mb-3"></div>
        <div class="grid grid-cols-1 items-center gap-3 lg:grid-cols-[170px_1fr]">
          <div class="h-[140px] sm:h-[150px] rounded-full bg-gray-100"></div>
          <div class="space-y-2">
            <div class="h-8 rounded-lg bg-gray-100"></div>
            <div class="h-8 rounded-lg bg-gray-100"></div>
            <div class="h-8 rounded-lg bg-gray-100"></div>
            <div class="h-8 rounded-lg bg-gray-100"></div>
          </div>
        </div>
      </article>
    }
  } @else {
    @if (overviewChart(); as chart) {
      <app-chart-card class="min-h-0 xl:h-full" [chart]="chart" />
    }

    @if (movementChart(); as chart) {
      <!-- <app-chart-card class="min-h-0 xl:h-full" [chart]="chart" /> -->
    }
  }
</div>
