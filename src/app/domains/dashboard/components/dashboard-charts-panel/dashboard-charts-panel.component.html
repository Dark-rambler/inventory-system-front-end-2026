<div class="grid min-h-0 h-full grid-cols-1 gap-3 lg:grid-cols-2 xl:grid-cols-1 xl:pl-1">
  @if (areChartsLoading()) {
    @for (index of [1]; track index) {
      <article
        class="h-full animate-pulse overflow-hidden rounded-xl border border-gray-200 bg-white p-4 shadow-sm dark:border-slate-700 dark:bg-slate-900"
      >
        <div class="mb-2 h-3 w-36 rounded bg-gray-200 dark:bg-slate-700"></div>
        <div class="mb-3 h-4 w-40 rounded bg-gray-200 dark:bg-slate-700"></div>
        <div class="mb-3 h-7 w-24 rounded bg-gray-100 dark:bg-slate-800"></div>
        <div class="grid grid-cols-1 items-center gap-3 lg:grid-cols-[170px_1fr]">
          <div class="h-[140px] rounded-full bg-gray-100 dark:bg-slate-800 sm:h-[150px]"></div>
          <div class="space-y-2">
            <div class="h-8 rounded-lg bg-gray-100 dark:bg-slate-800"></div>
            <div class="h-8 rounded-lg bg-gray-100 dark:bg-slate-800"></div>
            <div class="h-8 rounded-lg bg-gray-100 dark:bg-slate-800"></div>
            <div class="h-8 rounded-lg bg-gray-100 dark:bg-slate-800"></div>
          </div>
        </div>
      </article>
    }
  } @else {
    @if (overviewChart(); as chart) {
      <app-chart-card class="min-h-0 xl:h-full" [chart]="chart" />
    }

    @if (movementChart(); as chart) {
      <!-- <app-chart-card class="min-h-0 xl:h-full" [chart]="chart" /> -->
    }
  }
</div>
