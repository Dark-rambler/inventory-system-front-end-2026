<section class="shrink-0 grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-3">
  @for (kpi of kpis; track kpi.id) {
    <article
      class="group relative overflow-hidden rounded-xl border border-gray-200 bg-white/95 p-4 shadow-sm transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md"
    >
      <div
        class="pointer-events-none absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-primary/85 via-secondary/80 to-info/75"
      ></div>

      <p class="text-xs sm:text-sm font-medium text-gray-500">{{ kpi.title }}</p>
      <p class="mt-1 text-xl sm:text-2xl font-semibold text-secondary">{{ kpi.value }}</p>
      <p class="mt-1.5 text-xs sm:text-sm font-medium" [class]="getHintToneClass(kpi.tone)">
        {{ kpi.hint }}
      </p>
    </article>
  }
</section>
