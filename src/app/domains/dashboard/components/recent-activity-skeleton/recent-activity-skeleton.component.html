@for (row of rows(); track row) {
  <div
    class="flex items-start justify-between gap-4 py-3 border-b border-gray-200 last:border-b-0 animate-pulse"
  >
    <div class="flex items-start gap-3 w-full">
      <div class="w-5 h-5 rounded bg-gray-200 mt-0.5"></div>
      <div class="w-full max-w-64">
        <div class="h-4 rounded bg-gray-200 mb-2"></div>
        <div class="h-3 rounded bg-gray-100 w-32"></div>
      </div>
    </div>
    <div class="w-40 h-4 rounded bg-gray-100 mt-0.5"></div>
  </div>
}
