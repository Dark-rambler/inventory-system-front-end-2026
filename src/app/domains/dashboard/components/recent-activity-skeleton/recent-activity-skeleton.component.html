@for (row of rows(); track row) {
  <div
    class="flex animate-pulse items-start justify-between gap-4 border-b border-gray-200 py-3 last:border-b-0 dark:border-slate-700"
  >
    <div class="flex w-full items-start gap-3">
      <div class="mt-0.5 h-5 w-5 rounded bg-gray-200 dark:bg-slate-700"></div>
      <div class="w-full max-w-64">
        <div class="mb-2 h-4 rounded bg-gray-200 dark:bg-slate-700"></div>
        <div class="h-3 w-32 rounded bg-gray-100 dark:bg-slate-800"></div>
      </div>
    </div>
    <div class="mt-0.5 h-4 w-40 rounded bg-gray-100 dark:bg-slate-800"></div>
  </div>
}
