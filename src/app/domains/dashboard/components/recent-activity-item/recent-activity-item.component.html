<div class="flex items-start justify-between gap-4 py-3 border-b border-gray-200 last:border-b-0">
  <div class="flex items-start gap-3 min-w-0">
    <span class="mt-0.5" [ngClass]="iconClass">
      @if (actionKey === 'add') {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      } @else if (actionKey === 'delete') {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4h6v3"
          />
        </svg>
      } @else {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 20h9" />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4 12.5-12.5z"
          />
        </svg>
      }
    </span>

    <div class="min-w-0">
      <p class="text-secondary text-sm sm:text-[15px] font-semibold leading-5 truncate">
        {{ actionLabel }} {{ title }}
      </p>
      <p class="text-gray-500 text-xs sm:text-sm leading-5 truncate">{{ subtitle }}</p>
    </div>
  </div>

  <p class="text-gray-400 text-[11px] sm:text-xs whitespace-nowrap pt-0.5">
    {{ activity().createdAt | date: 'dd/MM/y, HH:mm' }}
  </p>
</div>
