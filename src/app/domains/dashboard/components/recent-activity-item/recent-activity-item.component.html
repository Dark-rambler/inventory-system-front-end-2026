<div
  class="flex items-start justify-between gap-4 border-b border-gray-200 py-3 last:border-b-0 dark:border-slate-700"
>
  <div class="flex items-start gap-3 min-w-0">
    <span class="mt-0.5" [ngClass]="iconClass">
      @if (actionKey === 'add') {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
        </svg>
      } @else if (actionKey === 'delete') {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M9 7V4h6v3"
          />
        </svg>
      } @else {
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 20h9" />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4 12.5-12.5z"
          />
        </svg>
      }
    </span>

    <div class="min-w-0">
      <p class="truncate text-sm font-semibold leading-5 text-secondary sm:text-[15px]">
        {{ actionLabel }} {{ title }}
      </p>
      <p class="truncate text-xs leading-5 text-gray-500 dark:text-slate-400 sm:text-sm">
        {{ subtitle }}
      </p>
    </div>
  </div>

  <p class="whitespace-nowrap pt-0.5 text-[11px] text-gray-400 dark:text-slate-500 sm:text-xs">
    {{ activity().createdAt | date: 'dd/MM/y, HH:mm' }}
  </p>
</div>
