<app-accordion title="Filtros de inventario">
  <form [formGroup]="filtersForm" class="grid grid-cols-1 gap-4 p-5 sm:grid-cols-2 xl:grid-cols-3">
    <app-form-input
      [parentForm]="filtersForm"
      controlName="name"
      label="Nombre"
      name="name"
      placeholder="Buscar por nombre"
    ></app-form-input>

    <app-form-input
      [parentForm]="filtersForm"
      controlName="code"
      label="Codigo"
      name="code"
      placeholder="Buscar por codigo"
    ></app-form-input>

    <app-form-input
      [parentForm]="filtersForm"
      controlName="category"
      label="Categoria"
      name="category"
      placeholder="Buscar por categoria"
    ></app-form-input>
  </form>
</app-accordion>
