<div
  class="flex h-[calc(100vh-7rem)] min-h-0 flex-col gap-4 overflow-hidden bg-gray-50 p-4 lg:h-[calc(100vh-8rem)] lg:flex-row"
>
  <!-- Productos -->
  <div class="flex-1 flex flex-col gap-4 overflow-hidden min-w-0">
    <app-products-pos
      [categories]="categories()"
      [selectedCategory]="_selectedCategory()"
      [products]="filteredProducts()"
      [isLoading]="isLoading()"
      [hasError]="hasError()"
      [paginator]="paginatorData()"
      [currentPage]="params().page"
      [currentPageSize]="params().pageSize"
      (searchChange)="onSearch($event)"
      (categoryChange)="onCategoryChange($event)"
      (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)"
    />
  </div>

  <!-- Carrito -->
  <div class="flex h-[24rem] flex-shrink-0 flex-col min-h-0 sm:h-[26rem] lg:h-full lg:w-96">
    <app-cart-pos />
  </div>
</div>
