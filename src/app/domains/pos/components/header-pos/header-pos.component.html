<!-- Header -->
<div class="bg-white rounded-xl shadow-sm border border-gray-100 px-4 py-3 flex-shrink-0">
  <div class="flex flex-col sm:flex-row sm:items-center gap-3">
    <!-- Buscador -->
    <div class="relative flex-1">
      <svg
        class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
      <input
        type="text"
        placeholder="Buscar por nombre o código..."
        (input)="onSearch($any($event.target).value)"
        class="w-full pl-9 pr-4 py-2 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all placeholder:text-gray-400 bg-gray-50 focus:bg-white"
      />
    </div>

    <!-- Filtro de categorías -->
    <app-category-filter
      [categories]="categories()"
      [selectedCategory]="selectedCategory()"
      (categoryChange)="selectCategory($event)"
    />
  </div>
</div>
