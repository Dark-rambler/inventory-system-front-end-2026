<app-table
  [data]="categoryData()?.items ?? []"
  [columns]="categoryColumns"
  [config]="tableConfig()"
>
  <ng-template appTableColumn="actions" let-category>
    <app-action-buttons>
      <div appViewDetails>
        <app-icon-button action="view" />
      </div>

      <div appEditItem>
        <app-icon-button (buttonClick)="editCategory(category)" action="edit" />
      </div>

      <div>
        <app-icon-button
          (buttonClick)="deleteCategory(category)"
          action="delete"
          tooltip="Eliminar"
        />
      </div>
    </app-action-buttons>
  </ng-template>
</app-table>

@if (categoryData(); as data) {
  <app-paginator
    [paginator]="data"
    [currentPage]="currentPage().page ?? 1"
    [currentPageSize]="currentPage().pageSize ?? 10"
    (pageChange)="changePage($event)"
    (pageSizeChange)="changePageSize($event)"
  />
}
