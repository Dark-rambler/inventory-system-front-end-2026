<div class="products-page">
  <!-- Header de la página -->
  <div class="products-header">
    <div>
      <h1 class="products-title">Gestión de Productos</h1>
      <p class="products-subtitle">Administra el inventario de productos del sistema</p>
    </div>
    <button class="btn-primary">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Nuevo Producto
    </button>
  </div>

  <!-- Tabla de productos -->
  <div class="products-table-container">
    <app-table
      [data]="products"
      [columns]="columns"
      [config]="tableConfig"
      (actionClick)="handleAction($event)"
    >
      <!-- Template personalizado para la columna de nombre -->
      <ng-template appTableColumn="name" let-product>
        <div class="flex items-center gap-3">
          <div class="product-avatar">
            {{ product.name.charAt(0) }}
          </div>
          <div>
            <p class="font-semibold text-gray-900">{{ product.name }}</p>
            <p class="text-xs text-gray-500">{{ product.sku }}</p>
          </div>
        </div>
      </ng-template>

      <!-- Template personalizado para la columna de stock -->
      <ng-template appTableColumn="stock" let-product>
        <span [class]="getStockClass(product.stock)"> {{ product.stock }} unidades </span>
      </ng-template>

      <!-- Template personalizado para la columna de estado -->
      <ng-template appTableColumn="status" let-product>
        <span class="status-badge" [class]="getStatusClass(product.status)">
          {{ getStatusText(product.status) }}
        </span>
      </ng-template>

      <!-- Template personalizado para la columna de acciones -->
      <ng-template appTableColumn="actions" let-product let-i="index">
        <div class="app-table-actions">
          <!-- Botón Ver -->
          <button
            type="button"
            class="app-table-action-btn app-table-action-btn--view"
            (click)="handleAction({ action: 'view', row: product, index: i })"
            title="Ver detalles"
          >
            <svg
              class="app-table-action-icon"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              />
            </svg>
          </button>

          <!-- Botón Editar -->
          <button
            type="button"
            class="app-table-action-btn app-table-action-btn--edit"
            (click)="handleAction({ action: 'edit', row: product, index: i })"
            title="Editar producto"
          >
            <svg
              class="app-table-action-icon"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
              />
            </svg>
          </button>

          <!-- Botón Eliminar -->
          <button
            type="button"
            class="app-table-action-btn app-table-action-btn--delete"
            (click)="handleAction({ action: 'delete', row: product, index: i })"
            title="Eliminar producto"
          >
            <svg
              class="app-table-action-icon"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
              />
            </svg>
          </button>
        </div>
      </ng-template>
    </app-table>
  </div>
</div>
